[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-slider-captcha"
version = "0.1.1"
description = "One-time puzzle CAPTCHA API for Django REST Framework and rc-slider-captcha"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Django>=4.2,<7", "djangorestframework>=3.15,<4", "Pillow>=10.4,<13"]

[project.urls]
Homepage = "https://github.com/suqingdong/drf_slider_captcha"
Repository = "https://github.com/suqingdong/drf_slider_captcha"
Issues = "https://github.com/suqingdong/drf_slider_captcha/issues"

[project.optional-dependencies]
redis = ["redis>=5,<8"]

[tool.setuptools.packages.find]
include = ["drf_slider_captcha*"]
